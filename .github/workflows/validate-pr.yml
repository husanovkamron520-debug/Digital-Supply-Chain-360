name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          for file in ./*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Verify committed Cloudflare assets match source
        run: |
          for file in ./*.html ./*.css ./*.js; do
            target="dist/${file#./}"
            if [ ! -f "$target" ] || ! cmp -s "$file" "$target"; then
              echo "::error::Cloudflare asset copy is missing or stale: $target. Update dist/ alongside source."
              exit 1
            fi
          done
      - name: Validate SQL migration syntax
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = sorted(Path("supabase/migrations").glob("2026111800*.sql"))
          for path in files:
              parse_sql(path.read_text())
              print(f"SQL parsed: {path}")
          PY
